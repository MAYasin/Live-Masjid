[package]
name = "livemasjid"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Always-on Live Masjid auto-player for Raspberry Pi"
license = "Unlicense"

[features]
default = []
# HTTPS for www.livemasjid.com (needs a C compiler for ring; enabled in CI builds).
tls = ["reqwest/rustls-no-provider", "reqwest/webpki-roots", "dep:rustls"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util", "signal", "fs"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "form"] }
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", default-features = false, features = ["mp3"] }
opus-pure = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
anyhow = "1"
sha2 = "0.11"
rand = "0.10"
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
# Router tests drive the real axum stack with `oneshot`.
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Lint policy (see .agents/skills/rust-best-practices). CI runs clippy with -D warnings.
[lints.rust]
unsafe_code = "forbid"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
# No panics in production code: errors are returned or handled (tests may unwrap: clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
# Silencing a lint needs #[expect(..., reason = "...")], which also fails once it is stale.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Real bugs or waste, from the pedantic and nursery groups.
unchecked_time_subtraction = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
needless_collect = "warn"
format_collect = "warn"
assigning_clones = "warn"
redundant_closure_for_method_calls = "warn"
map_unwrap_or = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"
manual_string_new = "warn"
ignored_unit_patterns = "warn"
