[package]
name = "livemasjid"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Always-on Live Masjid auto-player for Raspberry Pi"
license = "MIT"

[features]
default = []
# HTTPS for www.livemasjid.com (needs a C compiler for ring; enabled in CI builds).
tls = ["reqwest/rustls-no-provider", "reqwest/webpki-roots", "dep:rustls"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util", "signal", "fs"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "form"] }
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", default-features = false, features = ["mp3"] }
opus-pure = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
anyhow = "1"
sha2 = "0.10"
rand = "0.9"
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
